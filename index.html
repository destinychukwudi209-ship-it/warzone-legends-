
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>WARZONE LEGENDS</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #101b18;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

#lobby {
  position: fixed;
  inset: 0;
  z-index: 3;
  background: linear-gradient(135deg,#101d19,#253c2b);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
}

h1 {
  color: #e8c65c;
  font-size: 30px;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

#lobby p {
  color: #b8c7bc;
  margin: 12px;
}

button {
  border: none;
  background: linear-gradient(135deg,#f0d36a,#a27b27);
  color: #101010;
  padding: 15px 35px;
  border-radius: 5px;
  font-weight: bold;
  font-size: 16px;
  cursor: pointer;
  touch-action: none;
}

#gameMessage {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 2;
  font-size: 12px;
  color: white;
}

#gameControls {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}

.pad {
  position: absolute;
  bottom: 35px;
  left: 20px;
  display: grid;
  grid-template-columns: 55px 55px 55px;
  grid-template-rows: 55px 55px;
  gap: 5px;
  pointer-events: auto;
}

.pad button {
  padding: 0;
  font-size: 22px;
  background: #17251dcc;
  color: white;
  border: 1px solid #e8c65c;
}

#up { grid-column: 2; }
#left { grid-column: 1; grid-row: 2; }
#down { grid-column: 2; grid-row: 2; }
#right { grid-column: 3; grid-row: 2; }

#hint {
  position: absolute;
  right: 15px;
  bottom: 40px;
  color: white;
  font-size: 11px;
  text-align: right;
}
</style>
</head>

<body>

<div id="lobby">
  <h1>WARZONE LEGENDS</h1>
  <p>3D BATTLEFIELD</p>
  <p>YOUR MISSION STARTS HERE</p>
  <button onclick="startGame()">ENTER BATTLEFIELD</button>
</div>

<div id="gameMessage">WARZONE LEGENDS | READY</div>

<div id="gameControls">
  <div class="pad">
    <button id="up">▲</button>
    <button id="left">◀</button>
    <button id="down">▼</button>
    <button id="right">▶</button>
  </div>
  <div id="hint">MOVE: WASD<br>OR USE THE DIRECTION PAD</div>
</div>

<script type="module" src="./game.js"></script>

</body>
</html>
