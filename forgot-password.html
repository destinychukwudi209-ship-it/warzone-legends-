
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090711">
<title>WARZONE LEGENDS | Password Recovery</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: radial-gradient(ellipse at top,#38205e,#100b1c 55%,#080711);
  color: white;
  font-family: Arial,sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
}

.container {
  width: 100%;
  max-width: 420px;
}

.logo {
  text-align: center;
  margin-bottom: 30px;
}

.logo .symbol {
  font-size: 48px;
  color: #a76aff;
}

.logo h1 {
  font-size: 27px;
  letter-spacing: 2px;
  background: linear-gradient(90deg,#a76aff,#f0ce65);
  -webkit-background-clip: text;
  color: transparent;
}

.logo p {
  color: #aaa0ba;
  font-size: 11px;
  letter-spacing: 4px;
  margin-top: 8px;
}

.card {
  background: linear-gradient(145deg,#1d1530,#100d1b);
  border: 1px solid #6941a0;
  border-radius: 17px;
  padding: 28px 23px;
  box-shadow: 0 15px 50px #0009;
}

.icon {
  width: 65px;
  height: 65px;
  border-radius: 50%;
  background: #35204f;
  color: #c18cff;
  display: grid;
  place-items: center;
  font-size: 30px;
  margin-bottom: 22px;
}

h2 {
  font-size: 24px;
  margin-bottom: 12px;
}

.description {
  color: #aaa0ba;
  font-size: 13px;
  line-height: 1.7;
  margin-bottom: 25px;
}

label {
  display: block;
  font-size: 12px;
  color: #d4c5e9;
  margin-bottom: 9px;
}

input {
  width: 100%;
  padding: 15px;
  background: #090711;
  border: 1px solid #40304f;
  border-radius: 8px;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #a76aff;
}

button {
  width: 100%;
  padding: 16px;
  margin-top: 22px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(100deg,#873ee7,#b477ff);
  color: white;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
}

.message {
  display: none;
  color: #ffd88b;
  background: #352719;
  border-radius: 7px;
  padding: 12px;
  margin-top: 15px;
  font-size: 12px;
  line-height: 1.5;
}

.back {
  text-align: center;
  margin-top: 24px;
}

.back a {
  color: #c18cff;
  font-size: 13px;
  text-decoration: none;
}

.footer {
  text-align: center;
  color: #716982;
  font-size: 10px;
  margin-top: 25px;
}
</style>
</head>

<body>

<main class="container">

<header class="logo">
  <div class="symbol">♛</div>
  <h1>WARZONE LEGENDS</h1>
  <p>FIGHT • SURVIVE • WIN</p>
</header>

<section class="card">

<div class="icon">🔐</div>

<h2>Forgot Password?</h2>

<p class="description">
  Forgot your account password?
  Enter your registered email address.
  Password recovery will be connected when
  the secure account system is ready.
</p>

<form id="recoveryForm">

<label for="email">REGISTERED EMAIL ADDRESS</label>

<input
  id="email"
  type="email"
  placeholder="Enter your email address"
  required>

<button type="submit">
  REQUEST PASSWORD RESET
</button>

<div class="message" id="message"></div>

</form>

<div class="back">
  <a href="login.html">← BACK TO LOGIN</a>
</div>

</section>

<footer class="footer">
  WARZONE LEGENDS © 2026
</footer>

</main>

<script>
document.getElementById("recoveryForm")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const message = document.getElementById("message");

  message.style.display = "block";
  message.textContent =
    "Password recovery will become available after backend authentication is connected.";
});
</script>

</body>
</html>
